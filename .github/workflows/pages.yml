name: Validate and deploy to GitHub Pages

on:
  push:
    branches: [main, website]
  pull_request:
    branches: [main, website]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    name: Check content, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Resolve site URL and base path
        env:
          REPOSITORY: ${{ github.repository }}
          CONFIGURED_SITE_URL: ${{ vars.SITE_URL }}
          CONFIGURED_BASE_PATH: ${{ vars.BASE_PATH }}
        run: node scripts/pages-env.mjs >> "$GITHUB_ENV"
      - name: Check types, translations and source coverage
        run: npm run check
      - name: Test saved progress and deployment configuration
        run: npm test
      - name: Build the complete static site
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test navigation, quizzes, language and mobile layouts
        run: npm run test:e2e
      - name: Retain browser test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Upload deployable Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish validated site
    needs: validate
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
